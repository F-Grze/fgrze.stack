te-pulse\",\"children\":\"正在载入档案...\"}],\"children\":[\"$\",\"$L2d\",null,{\"contentHtml\":\"\u003cp\u003e个人简介\u003c/p\u003e\\n\u003cp\u003e你好，我是 \u003cstrong\u003eF-Grze\u003c/strong\u003e。\u003c/p\u003e\\n\u003cp\u003e白天写界面，晚上画墙。喜欢把版式推到极限，也喜欢把噪点留在画面里。\u003c/p\u003e\\n\u003cp\u003e\u003cstrong\u003e🎨 视觉与界面\u003c/strong\u003e\u003c/p\u003e\\n\u003cul\u003e\\n\u003cli\u003e\u003cstrong\u003e设计系统:\u003c/strong\u003e 用变量和栅格管住颜色与间距，让一个站点在十几种屏幕上都成立。\u003c/li\u003e\\n\u003cli\u003e\u003cstrong\u003e字体排印:\u003c/strong\u003e 中文用宋，西文用无衬线，靠字重和字距分层，而不是靠色块。\u003c/li\u003e\\n\u003cli\u003e\u003cstrong\u003e动效:\u003c/strong\u003e 慢一点、少一点。能用 1.6 秒淡入解决的问题，不要用弹跳。\u003c/li\u003e\\n\u003c/ul\u003e\\n\u003cp\u003e\u003cstrong\u003e💻 前端与工程\u003c/strong\u003e\u003c/p\u003e\\n\u003cul\u003e\\n\u003cli\u003e\u003cstrong\u003e框架:\u003c/strong\u003e 主要用 \u003cstrong\u003eNext.js\u003c/strong\u003e 与 \u003cstrong\u003eReact\u003c/strong\u003e，Tailwind 处理样式，少量原生 CSS 处理细节。\u003c/li\u003e\\n\u003cli\u003e\u003cstrong\u003e性能:\u003c/strong\u003e 图片统一转 WebP，首屏只加载需要的资源，动画尽量交给合成层。\u003c/li\u003e\\n\u003cli\u003e\u003cstrong\u003e部署:\u003c/strong\u003e 静态导出优先，能不用服务端就不引入服务端。\u003c/li\u003e\\n\u003c/ul\u003e\\n\u003cp\u003e\u003cstrong\u003e🧱 关于这个站\u003c/strong\u003e\u003c/p\u003e\\n\u003cp\u003e这是一份开源博客模板的复刻：结构、交互、页面构成都沿用原作，视觉重做成浅色纸感，壁纸换成自己的五张涂鸦稿，每五秒换一张。\u003c/p\u003e\\n\u003cp\u003e\u003cstrong\u003e欢迎来聊。\u003c/strong\u003e\u003c/p\u003e\",\"coverImage\":\"/fgrze.stack/media/img-04.webp\",\"activities\":[{\"id\":\"posts-molecular-gnn.md\",\"type\":\"文章\",\"title\":\"把反应堆和分子塞进图里：一次分子模拟与图神经网络的联调\",\"date\":\"2026-11-02T13:40:00.000Z\",\"url\":\"/posts/molecular-gnn\"},{\"id\":\"posts-rebuild-notes.md\",\"type\":\"文章\",\"title\":\"把一份 Next.js 博客复刻到 90%：做法与取舍\",\"date\":\"2026-10-28T14:10:00.000Z\",\"url\":\"/posts/rebuild-notes\"},{\"id\":\"moments-moment-1777182725435.md\",\"type\":\"说说\",\"title\":\"moment-1777182725435\",\"date\":\"2026-10-27T05:52:05.435Z\",\"url\":\"/moments/moment-1777182725435\"}
