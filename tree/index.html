RouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L9\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}]\n21:T1c65,"])</script><script>self.__next_f.push([1,"做机器学习的人大概都熟悉这种场景：模型跑得比实验快，于是你开始怀疑它到底学到了什么。而做分子模拟的人刚好反过来——实验跑得太慢，慢到只能截取其中一小段，问模型能不能替我把剩下的一段补完。\n\n这篇笔记记录我最近在做的这件事：拿一个简化版的小体系（几个粒子 + 一个粗糙的势能面）当数据源，训一个图神经网络，让它同时输出下一时刻的坐标和力，然后在轨迹对比里看它到底像不像。\n\n## 先说清楚为什么是图\n\n分子体系的自然表示就是图：\n\n- **节点** = 原子，特征是元素种类、部分电荷、所属残基、空间位置；\n- **边** = 原子对，作用半径 cutoff 之内连边，特征是距离、距离的径向基展开（RBF）、方向余弦；\n- **全局特征** = 体系温度、总能量、盒子尺寸。\n\n关键在于置换等变性：两个原子互换编号，物理上不应该有任何区别。所有消息传递的层数堆得再深，也只是让每个原子的表示依赖于它的邻域，而邻域本身又被规范成度数归一化的形式。\n\n```python\nimport torch\nimport torch.nn as nn\n\n\nclass MessagePassing(nn.Module):\n    \"\"\"单层消息传递：边上的标量消息聚合到节点上。\"\"\"\n\n    def __init__(self, hidden: int, cutoff: float = 5.0):\n        super().__init__()\n        self.cutoff = cutoff\n        # 边 MLP：RBF 展开 -\u003e 消息\n        self.edge_mlp = nn.Sequential(\n            nn.Linear(hidden, hidden),\n            nn.SiLU(),\n            nn.Linear(hidden, hidden),\n        )\n        # 节点更新 MLP\n        self.node_mlp = nn.Sequential(\n            nn.Linear(hidden * 2, hidden),\n            nn.SiLU(),\n            nn.Linear(hidden, hidden),\n        )\n\n    def forward(self, x, edge_index, edge_attr, edge_vec, batch):\n        \"\"\"x: [N, H]  节点特征\n        edge_index: [2, E]  边索引\n        edge_attr: [E, H]  边特征（已做 RBF 展开）\n        edge_vec: [E, 3]  单位方向向量\n        \"\"\"\n        src, dst = edge_index\n        message = self.edge_mlp(edge_attr)\n\n        # 按目标节点聚合（sum），并做度数归一化\n        agg = torch.zeros_like(x)\n        agg.index_add_(0, dst, message)\n        deg = torch.zeros(x.size(0), device=x.device, dtype=x.dtype)\n        deg.index_add_(0, dst, torch.ones_like(dst, dtype=x.dtype))\n        agg = agg / (deg.unsqueeze(-1) + 1.0)\n\n        # 方向信息：沿边方向把消息再分一份给源节点\n        dir_msg = agg[src] * edge_vec\n\n        out = self.node_mlp(torch.cat([x, agg + dir_msg], dim=-1))\n        return out + x  # 残差连接，训练更稳\n```\n\n## 邻居列表是最容易出错的地方\n\n我在这上面踩过一次很典型的坑：推理时用的 cutoff 比训练时大 0.1 Å，误差直接翻了四倍。原因不玄学——**图的边集变了**。模型学到的是\"在这个邻域结构下的更新规则\"，你把边集换掉，等于把问题换掉了。\n\n所以训练和推理必须共用同一套建图逻辑，并且这个逻辑要写在 Dataset 里，而不是散落在训练脚本里。\n\n```python\nimport numpy as np\n\n\ndef build_neighbor_list(positions, cutoff=5.0, max_neighbors=32, cell=None):\n    \"\"\"周期性边界下的邻居列表。\n    positions: [N, 3]\n    返回 (edge_index, edge_vec, edge_dist, mask)\n    \"\"\"\n    n = positions.shape[0]\n    # 用 cell 偏移做最小镜像约定\n    delta = positions[:, None, :] - positions[None, :, :]\n    if cell is not None:\n        delta -= cell * np.round(delta / cell)\n    dist = np.linalg.norm(delta, axis=-1)\n\n    mask = (dist \u003c cutoff) \u0026 (dist \u003e 1e-6)\n    # 屏蔽自己\n    np.fill_diagonal(mask, False)\n\n    src, dst = np.nonzero(mask)\n    vec = delta[src, dst]\n    d = dist[src, dst]\n\n    # 每个节点最多保留 max_neighbors 个最近的邻居\n    if len(src) \u003e 0:\n        order = np.lexsort((d, src))\n        src, dst, vec, d = src[order], dst[order], vec[order], d[order]\n        counts = np.bincount(src, minlength=n)\n        keep_src, keep_dst, keep_vec, keep_d = [], [], [], []\n        start = 0\n        for c in counts:\n            idx = np.arange(start, start + min(c, max_neighbors))\n            keep_src.append(src[idx]); keep_dst.append(dst[idx])\n            keep_vec.append(vec[idx]); keep_d.append(d[idx])\n            start += c\n        src = np.concatenate(keep_src); dst = np.concatenate(keep_dst)\n        vec = np.concatenate(keep_vec); d = np.concatenate(keep_d)\n\n    unit = vec / np.maximum(np.linalg.norm(vec, axis=-1, keepdims=True), 1e-9)\n    edge_index = np.stack([src, dst])\n    return edge_index, unit.astype(np.float32), d.astype(np.float32), mask\n```\n\n## 损失函数：力和能量要分开看\n\n坐标直接回归 MSE 会让模型学得很\"懒\"——它倾向于输出一个安全的平均值，因为坐标误差的尺度不可控。更好的做法是把力当成向量的梯度来监督，而能量作为标量辅助任务。\n\n```python\ndef force_loss(pred_force, true_force, sigma=10.0):\n    \"\"\"力的损失：先做归一化，否则大体系会把 loss 尺度拉爆。\"\"\"\n    scale = sigma / (np.abs(true_force).mean() + 1e-8)\n    return torch.mean((scale * (pred_force - true_force)) ** 2)\n\n\ndef energy_loss(pred_energy, true_energy):\n    \"\"\"能量的损失：按体系大小做归一化（每原子能量）。\"\"\"\n    return torch.mean((pred_energy - true_energy) ** 2)\n\n\n# 训练时的总损失\nloss = force_loss(out.force, batch.force) + 0.1 * energy_loss(out.energy, batch.energy)\n```\n\n我的经验是：**力的权重比能量重要一个数量级**。能量错了模型还能凑合，力量错了轨迹就完全跑偏——因为积分器会把力误差当成速度误差直接累积。\n\n## 轨迹对比比逐点误差更能说明问题\n\n逐帧 RMSE 好看不代表轨迹对。真正要看的是沿时间方向的稳定性：模型会不会在某个高势垒区域\"卡住\"，或者在势阱里画出奇怪的圈。\n\n```python\nimport matplotlib.pyplot as plt\n\n\ndef compare_trajectory(pred_traj, true_traj, atom_idx=0):\n    \"\"\"pred_traj / true_traj: [T, N, 3]\"\"\"\n    t = np.arange(pred_traj.shape[0])\n    err = np.linalg.norm(pred_traj[:, atom_idx] - true_traj[:, atom_idx], axis=-1)\n\n    fig, ax = plt.subplots(figsize=(8, 4))\n    ax.plot(t, err, lw=1.6, color=\"#b4613a\")\n    ax.set_xlabel(\"step\")\n    ax.set_ylabel(\"||r_pred - r_true||\")\n    ax.set_title(f\"atom {atom_idx} trajectory error\")\n    ax.grid(alpha=0.25)\n    plt.tight_layout()\n    return fig, ax\n```\n\n## 还没解决的问题\n\n1. **长程相互作用**：cutoff 之外的相互作用现在完全丢掉了，在长程静电显著的体系里误差积累很快。\n2. **多保态**：双阱势垒那种场景，模型很容易学出\"平均行为\"，把两个态之间的跃迁抹平。\n3. **速度依赖**：真正的 MD 里力还依赖速度，当前实现只有位置依赖的保守力。\n\n这些都是可以继续做的方向。先把\"能跑通\"的部分记下来，剩下的留到下一篇。\n\n## 小结\n\n- 图天然契合分子体系，置换等变性靠度数归一化 + 方向消息来保；\n- 邻居列表必须训练/推理共用同一份代码；\n- 力的损失比能量重要得多；\n- 评价要看轨迹稳定性，而不是逐点 RMSE。"])</script><script>self.__next_f.push([1,"13:[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"$L20\",null,{\"posts\":[{\"id\":\"light-theme-notes\",\"slug\":\"light-theme-notes\",\"title\":\"浅色主题的重构：纸感、墨线与一点点黄铜\",\"type\":\"post\",\"date\":\"2026-10-26 01:40:00\",\"cover\":\"/fgrze.stack/media/img-09.webp\",\"content\":\"## 不要逐个组件改颜色\\n\\n模板里有几十个组件，写死了 `text-indigo-600`、`bg-purple-500`、`from-indigo-500` 这样的工具类。一个个改，改到一半就会漏。\\n\\nTailwind 4 的 `@theme` 把这些颜色变成了 CSS 变量，于是只要在根上重新定义一次，全站的颜色就跟着变了：\\n\\n```css\\n@theme {\\n  --color-indigo-400: #5b5b66;\\n  --color-indigo-500: #26262e;\\n  --color-indigo-600: #14141a;\\n  --color-pink-500:  #a27a44;\\n}\\n```\\n\\n- `indigo` 收成墨色阶——用于标题、链接、主按钮、激活态；\\n- `purple` 退成石墨灰——用于次要的数字与描述；\\n- `pink` 换成黄铜——留给「照片」这类需要一点暖意的计数。\\n\\n## 暗色模式要能切回去\\n\\n变量重定义会连暗色模式一起改掉，所以再给 `html.dark` 补一层原始色板：\\n\\n```css\\nhtml.dark {\\n  --color-indigo-500: #6366f1;\\n  --color-pink-500: #ec4899;\\n}\\n```\\n\\n切回夜间模式时，霓虹色原样回来，两套主题都成立。\\n\\n## 表面处理的三条规矩\\n\\n1. **卡片不能太透**。背景是有花纹的涂鸦墙，透明度低于 0.6 就会脏。\\n2. **描边要细**。白色描边在浅色底上几乎没有意义，换成 `rgba(16,16,22,0.10)` 的墨线，立刻有了印刷品的骨架。\\n3. **阴影要收**。深色主题靠阴影做体积，浅色主题靠阴影只会显脏，所以只留一层很浅的落影。\\n\\n## 最后是纸\\n\\n页面底色用了一个偏暖的米白 `#f6f4ee`，而不是纯白。纯白会让壁纸显得脏，米白会把壁纸里的冷色往暖里拉一点。\"},{\"id\":\"molecular-gnn\",\"slug\":\"molecular-gnn\",\"title\":\"把反应堆和分子塞进图里：一次分子模拟与图神经网络的联调\",\"type\":\"post\",\"date\":\"2026-11-02 21:40:00\",\"cover\":\"/fgrze.stack/media/img-17.webp\",\"content\":\"$21\"},{\"id\":\"rebuild-notes\",\"slug\":\"rebuild-notes\",\"title\":\"把一份 Next.js 博客复刻到 90%：做法与取舍\",\"type\":\"post\",\"date\":\"2026-10-28 22:10:00\",\"cover\":\"/fgrze.stack/media/img-02.webp\",\"content\":\"## 为什么要复刻\\n\\n看到一份做得相当完整的个人博客模板：首页是信息密度很高的卡片矩阵，配置里有网易云播放器、照片墙、说说、杂谈、友链、归档时间轴，甚至还有一个 3D 的「灵境」页面。\\n\\n直接拿来用当然最快，但我想要的是「像它、但不是它」——版式与交互照搬，配色与壁纸换成自己的。于是有了这次复刻。\\n\\n## 结构照搬，是最省力的高保真\\n\\n复刻的第一原则是：**能用原始结构就不要重画结构**。\\n\\n- 首页的 `max-w-6xl` 容器、`lg:grid-cols-12` 的十二栏切分，原样保留；\\n- 文章卡、照片墙海报、说说轮播的尺寸与圆角，一个像素都没改；\\n- 导航栏「向下滚动隐藏」、手机端的可拖拽圆盘菜单，全部沿用。\\n\\n真正动刀的只有三处：主题色板、背景处理、文案与壁纸。\\n\\n## 去掉「深色」，但留住「重量」\\n\\n原模板是深色玻璃质感：半透明深灰卡片、霓虹靛蓝点缀。换到浅色如果只是把背景刷白，会立刻垮掉——卡片失去层次，文字浮在空气里。\\n\\n所以做了两件事：\\n\\n1. **把玻璃换成纸**：卡片底色收到 `rgba(255,255,255,0.68)` 左右，保留一点透明让壁纸透出来，但足够压住底下的花纹。\\n2. **把霓虹换成墨**：原来所有 `indigo-500/600` 的强调色，统一映射成近黑的墨色；白色描边改成一像素的墨线。\\n\\n\u003e 浅色不是「没有重量」，重量应该来自线条和字重，而不是背景的黑。\\n\\n## 代价与收获\\n\\n代价是暗色模式变得次要了——里面还留着原来的霓虹色板，切回去依然成立，只是不再是主角。\\n\\n收获是：这套东西现在看起来像一本印刷品，而不是一块发光的屏幕。\"},{\"id\":\"wallpaper-carousel\",\"slug\":\"wallpaper-carousel\",\"title\":\"五张壁纸，五秒一次：背景轮播的几个细节\",\"type\":\"post\",\"date\":\"2026-10-24 23:05:00\",\"cover\":\"/fgrze.stack/media/img-03.webp\",\"content\":\"## 需求其实很少\\n\\n五张竖版插画，每五秒换一张，作为整站的背景。听上去就是 `setInterval` 加 `opacity` 的事。\\n\\n真做起来，有三个坑。\\n\\n## 坑一：竖图铺满横屏\\n\\n插画是 1080×1920 的竖图，桌面是 16:9。`background-size: cover` 会把画面放大到只露出中间一小条——人物的头被切掉一半，看起来像事故现场。\\n\\n最后的处理是：**不追求「看见完整的人」，而是让整面墙成为氛围**。图片做 3px 柔焦、轻微提亮，再压一层 26% 的米白纸色。涂鸦的色块还在，但不会抢卡片的注意力。\\n\\n## 坑二：切换时闪黑\\n\\n如果直接替换 `background-image`，浏览器会先清空再加载，中间闪一下底色。\\n\\n所以改成五层 `\u003cimg\u003e` 堆叠，一直保持挂载，只切 `opacity`：\\n\\n```css\\n.slide {\\n  position: absolute;\\n  inset: 0;\\n  transition: opacity 1600ms ease-in-out;\\n}\\n```\\n\\n1600ms 比切换间隔短很多，交叉淡入淡出就显得很稳。\\n\\n## 坑三：静止的画面很死\\n\\n光淡入淡出还是「幻灯片」。给当前帧加一个 16 秒的缓慢放大，从 1.02 到 1.1，观感就活了：\\n\\n```css\\n@keyframes kenburns {\\n  0%   { transform: scale(1.02); }\\n  100% { transform: scale(1.10); }\\n}\\n```\\n\\n\u003e 关键点：动画只在「当前帧」上挂载，切换时重置，这样五张图各自有独立的呼吸节奏。\\n\\n## 还有一个小细节\\n\\n`visibility` 也要跟着切。只改 `opacity` 的话，五张全尺寸图片会同时参与合成，移动端会明显掉帧；把非相邻的帧设为 `hidden`，渲染压力立刻降下来。\"}],\"chatters\":[{\"id\":\"2026-10-18-grain\",\"slug\":\"2026-10-18-grain\",\"title\":\"那层几乎看不见的噪点\",\"type\":\"chatter\",\"date\":\"2026-10-18 01:15:00\",\"cover\":\"/fgrze.stack/media/img-05.webp\",\"content\":\"在 body 上叠了一层 fractalNoise，透明度 3.5%，混合模式 multiply。\\n\\n单看是看不出什么的，关掉再开，整页会突然显得「薄」——像拿掉了一层纸的纤维。\\n\\n做浅色主题最容易忽略这件事：白不是颜色，白是材质。没有噪点的白，看起来像没打印出来的纸。\"},{\"id\":\"2026-10-22-type-scale\",\"slug\":\"2026-10-22-type-scale\",\"title\":\"把字号收窄到四档之后，页面安静了\",\"type\":\"chatter\",\"date\":\"2026-10-22 23:40:00\",\"cover\":\"/fgrze.stack/media/img-09.webp\",\"content\":\"之前一页里能出现九种字号，每个区块都想强调自己。后来强行砍到四档：标题、小标题、正文、注脚。\\n\\n结果反直觉：信息层级反而更清楚了。因为剩下的差别只能靠字重和字距来区分——中文宋体在 900 字重下本身就够重，不需要再放大来喊。\\n\\n唯一保留的例外是那个日期戳，等宽字体，比正文小两号，灰一档。它不需要被读到，只需要被找到。\"},{\"id\":\"2026-10-27-rebuild-log\",\"slug\":\"2026-10-27-rebuild-log\",\"title\":\"复刻到第七版，终于不再像别人的站了\",\"type\":\"chatter\",\"date\":\"2026-10-27 02:20:00\",\"cover\":\"/fgrze.stack/media/img-03.webp\",\"content\":\"改到第七版的时候，才意识到问题不在颜色，而在「谁在说话」。\\n\\n前六版一直在做同一件事：把别人站上的深色玻璃刷成白色。结果就是一间刷了白漆的地下室——结构还是那套结构，光进不来。\\n\\n第七版换了个思路。把强调色全部收掉，只留墨色和一点黄铜；把壁纸从「背景」降级成「氛围」，柔焦、压纸色、不再争抢视线；卡片留一像素的墨线当骨架。\\n\\n于是它突然安静了，也终于像是我会做的东西。\\n\\n\u003e 复刻最难的部分，不是还原得像，而是还原完之后，敢把它改得不像。\\n\\n剩下的时间在调那五张壁纸的切换节奏。五秒有点快，六秒又太慢，最后决定还是五秒——因为这是你要求的。\\n\\n凌晨两点二十，收工。\"}],\"moments\":[{\"id\":\"moment-1777128883968\",\"slug\":\"moment-1777128883968\",\"title\":\"\",\"type\":\"moment\",\"date\":\"2026-10-25T14:54:43.968Z\",\"cover\":null,\"content\":\"把五张涂鸦稿都过了一遍色，压掉一半饱和度才敢放到首页当背景。原图太凶了，会把文字全吃掉。\"},{\"id\":\"moment-1777171461214\",\"slug\":\"moment-1777171461214\",\"title\":\"\",\"type\":\"moment\",\"date\":\"2026-10-26T02:44:21.214Z\",\"cover\":null,\"content\":\"浅色主题的第十三稿。这次把卡片的白色描边全换成墨线，一像素，透明度 10%。就这一个改动，整页突然从「飘」变成「钉住」了。\"},{\"id\":\"moment-1777182725435\",\"slug\":\"moment-1777182725435\",\"title\":\"\",\"type\":\"moment\",\"date\":\"2026-10-27T05:52:05.435Z\",\"cover\":null,\"content\":\"整理壁纸的时候发现，竖版插画直接铺 16:9 会切得很惨。最后的办法是别争了，让整张图变成氛围，别让人一眼去找「人在哪」。\"}]}],[\"$L22\",\"$L23\",\"$L24\",\"$L25\",\"$L26\"],\"$L27\"]}]\n"])</script><script>self.__next_f.push([1,"28:[]\n14:\"$W28\"\n15:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L29\",null,{\"children\":\"$L2a\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L2b\",null,{\"children\":[\"$\",\"$2c\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L2d\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\n17:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/fgrze.stack/_next/static/chunks/0tmg9vcbw.fm2.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n18:[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/fgrze.stack/_next/static/chunks/0s1b_h0y6abo4.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n19:[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/fgr
